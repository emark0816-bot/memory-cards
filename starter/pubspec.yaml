name: memory_cards
description: Memory Cards – A Visual Journal Flutter app (course project).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Date formatting  (used from Stage 1)
  intl: ^0.20.0

  # Local storage  (used from Stage 3)
  shared_preferences: ^2.3.0

  # Photo attachment  (used in Stage 5, Track A)
  image_picker: ^1.2.4

  # Local notifications  (used in Stage 5, Track C)
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
dependency_overrides:
  path_provider_android: 2.2.23
